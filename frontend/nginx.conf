server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Public API proxy. Honors X-Accel-Redirect returned by the gateway:
    # when passport-service responds with that header, nginx swaps in the
    # internal subrequest below instead of returning the empty body.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # Internal-only handoff target for media streaming. The "internal"
    # directive guarantees this location can ONLY be reached via
    # X-Accel-Redirect from an upstream response, never by a direct
    # client request.
    #
    # passport-service generates an AWS SigV4 presigned URL for
    # http://minio:9000/<bucket>/<object>?...signature... then rewrites
    # the absolute URL into /_protected/minio/<bucket>/<object>?...sig...
    # When nginx proxies here with proxy_pass http://minio:9000/, the
    # path becomes /<bucket>/<object>?...sig... and the Host header
    # remains "minio:9000" (default $proxy_host), so the SigV4 signature
    # checks out at MinIO.
    location /_protected/minio/ {
        internal;
        proxy_pass http://minio:9000/;
        # Strip client headers so MinIO sees a clean request that
        # matches what was signed (only Host is in SignedHeaders).
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        # Streaming friendly for large files.
        proxy_buffering off;
        proxy_request_buffering off;
        # Hide MinIO internal headers from the client.
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-server-side-encryption;
        proxy_hide_header x-amz-version-id;
        # Browser caching policy for media. The URL changes per ticket,
        # so immutable is safe.
        add_header Cache-Control "private, max-age=300, immutable" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
