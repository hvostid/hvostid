server:
    port: 8083

spring:
    application:
        name: passport-service
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:hvostid_passport}
        username: ${DB_USER:hvostid}
        password: ${DB_PASSWORD:hvostid}
    flyway:
        enabled: true
        baseline-on-migrate: true
        locations: classpath:db/migration
        validate-on-migrate: true
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 20MB
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            connect-timeout: 2s
            timeout: 2s

hvostid:
    minio:
        url: http://${MINIO_HOST:localhost}:9000
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin}
        buckets:
            documents: ${MINIO_DOCUMENTS_BUCKET:pet-documents}
            photos: ${MINIO_PHOTOS_BUCKET:pet-photos}
    listing-service:
        url: http://${LISTING_SERVICE_HOST:localhost}:8082
        connect-timeout: 2s
        read-timeout: 3s
    media:
        # TTL bounds how long a ticket can sit before it is redeemed. The
        # browser fetches a ticket right before the <img> request fires, so a
        # tight value (single digit minutes) is fine.
        ticket-ttl: 5m
        # Lifetime of the MinIO presigned URL baked into X-Accel-Redirect.
        # The frontend nginx consumes the redirect immediately, so this can be
        # very short. Keep it long enough to absorb retries and clock skew.
        presign-ttl: 30s
        # Internal nginx location declared with the "internal" directive.
        # See frontend/nginx.conf for the matching proxy_pass to MinIO.
        internal-redirect-prefix: /_protected/minio

management:
    otlp:
        metrics:
            export:
                enabled: false
    opentelemetry:
        tracing:
            export:
                otlp:
                    enabled: false
    endpoints:
        web:
            exposure:
                include: health, info

logging:
    level:
        root: INFO
        ru.hvostid: DEBUG
