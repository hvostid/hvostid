groups:
    - name: hvostid
      rules:
          - alert: HvostidServiceDown
            expr: up{job="hvostid"} == 0
            for: 1m
            labels:
                severity: critical
            annotations:
                summary: 'Service {{ $labels.service }} cannot be scraped'
          - alert: HvostidHttpErrors
            expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum by (service) (rate(http_server_requests_seconds_count[5m])), 0.01) > 0.05
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: 'Service {{ $labels.service }} has more than 5% server errors'
          - alert: HvostidSlowRequests
            expr: histogram_quantile(0.95, sum by (le, service) (rate(http_server_requests_seconds_bucket[5m]))) > 2
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: 'Service {{ $labels.service }} p95 exceeds 2 seconds'
          - alert: HvostidDatabasePoolSaturation
            expr: hikaricp_connections_pending > 0
            for: 2m
            labels:
                severity: warning
            annotations:
                summary: 'Service {{ $labels.service }} is waiting for database connections'
