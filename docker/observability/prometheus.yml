global:
    scrape_interval: 15s
    evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
    alertmanagers:
        - static_configs:
              - targets: [alertmanager:9093]
scrape_configs:
    - job_name: hvostid
      metrics_path: /actuator/prometheus
      static_configs:
          - targets: [api-gateway:8080, auth-service:8081, listing-service:8082, passport-service:8083, matching-service:8084]
      relabel_configs:
          - source_labels: [__address__]
            regex: '([^:]+):.*'
            target_label: service
            replacement: '$1'
