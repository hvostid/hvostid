server:
    port: 8081

spring:
    application:
        name: auth-service
    mail:
        host: ${SPRING_MAIL_HOST:localhost}
        port: ${SPRING_MAIL_PORT:1025}
        username: ${SPRING_MAIL_USERNAME:}
        password: ${SPRING_MAIL_PASSWORD:}
        properties:
            mail.smtp.connectiontimeout: 5000
            mail.smtp.timeout: 5000
            mail.smtp.writetimeout: 5000
            mail.smtp.auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
            mail.smtp.starttls.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:hvostid_auth}
        username: ${DB_USER:hvostid}
        password: ${DB_PASSWORD:hvostid}
    flyway:
        enabled: true
        baseline-on-migrate: true
        locations: classpath:db/migration
        validate-on-migrate: true
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false

hvostid:
    auth:
        access-token-ttl: 30m
        refresh-token-ttl: 7d
        mail:
            enabled: ${AUTH_MAIL_ENABLED:false}
            from: ${AUTH_MAIL_FROM:no-reply@localhost}
            public-base-url: ${AUTH_PUBLIC_BASE_URL:http://localhost}
            # A distinct Base64-encoded 32-byte key protects pending email links at rest.
            encryption-key: ${AUTH_MAIL_ENCRYPTION_KEY:}

management:
    health:
        mail:
            # SMTP retries use the outbox; transport outages must not block login or service startup.
            enabled: false
    otlp:
        metrics:
            export:
                enabled: false
    opentelemetry:
        tracing:
            export:
                otlp:
                    enabled: false
    endpoints:
        web:
            exposure:
                include: health, info

logging:
    level:
        root: INFO
        ru.hvostid: DEBUG
