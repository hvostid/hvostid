server:
    port: 8084

spring:
    application:
        name: matching-service
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:hvostid_matching}
        username: ${DB_USER:hvostid}
        password: ${DB_PASSWORD:hvostid}
    flyway:
        enabled: true
        baseline-on-migrate: true
        locations: classpath:db/migration
        validate-on-migrate: true
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false

hvostid:
    recommendations:
        # Shared limits across all buyers; excess work returns a retryable 503.
        parallelism: ${MATCHING_PARALLELISM:16}
        max-concurrent-computations: ${MATCHING_MAX_COMPUTATIONS:8}
        max-scanned-listings: ${MATCHING_MAX_SCANNED_LISTINGS:10000}
        computation-timeout: ${MATCHING_COMPUTATION_TIMEOUT:30s}
    listing-service:
        url: http://${LISTING_SERVICE_HOST:localhost}:8082
        connect-timeout: 2s
        read-timeout: 3s
    passport-service:
        url: http://${PASSPORT_SERVICE_HOST:localhost}:8083
        connect-timeout: 2s
        read-timeout: 3s

resilience4j:
    circuitbreaker:
        instances:
            listingService:
                sliding-window-size: 10
                failure-rate-threshold: 50
                wait-duration-in-open-state: 10s
                permitted-number-of-calls-in-half-open-state: 3
                # 404 (not found) and 403 (not accessible to the caller) are
                # mapped to ListingNotFoundException and surfaced as 404 by the
                # controller. They are not availability failures, so they must
                # not feed the circuit-breaker window.
                ignore-exceptions:
                    - ru.hvostid.matching.exception.ListingNotFoundException
            passportService:
                sliding-window-size: 10
                failure-rate-threshold: 50
                wait-duration-in-open-state: 10s
                permitted-number-of-calls-in-half-open-state: 3

management:
    otlp:
        metrics:
            export:
                enabled: false
    opentelemetry:
        tracing:
            export:
                otlp:
                    enabled: false
    endpoints:
        web:
            exposure:
                include: health, info

logging:
    level:
        root: INFO
        ru.hvostid: DEBUG
