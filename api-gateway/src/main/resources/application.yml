server:
    port: 8080

spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                        -   id: auth-service
                            uri: http://${AUTH_SERVICE_HOST:localhost}:8081
                            predicates:
                                - Path=/api/v1/auth/**, /api/v1/profile/**, /api/v1/users/**

                        -   id: listing-service
                            uri: http://${LISTING_SERVICE_HOST:localhost}:8082
                            predicates:
                                - Path=/api/v1/listings/**, /api/v1/moderation/**

                        -   id: passport-service
                            uri: http://${PASSPORT_SERVICE_HOST:localhost}:8083
                            predicates:
                                - Path=/api/v1/passports/**

                        -   id: matching-service
                            uri: http://${MATCHING_SERVICE_HOST:localhost}:8084
                            predicates:
                                - Path=/api/v1/match/**

                        # Proxy each downstream service's /v3/api-docs so the
                        # aggregated Swagger UI (served by this gateway) can
                        # fetch every spec without cross-origin requests.
                        -   id: auth-service-openapi
                            uri: http://${AUTH_SERVICE_HOST:localhost}:8081
                            predicates:
                                - Path=/v3/api-docs/auth
                            filters:
                                - SetPath=/v3/api-docs

                        -   id: listing-service-openapi
                            uri: http://${LISTING_SERVICE_HOST:localhost}:8082
                            predicates:
                                - Path=/v3/api-docs/listing
                            filters:
                                - SetPath=/v3/api-docs

                        -   id: passport-service-openapi
                            uri: http://${PASSPORT_SERVICE_HOST:localhost}:8083
                            predicates:
                                - Path=/v3/api-docs/passport
                            filters:
                                - SetPath=/v3/api-docs

                        -   id: matching-service-openapi
                            uri: http://${MATCHING_SERVICE_HOST:localhost}:8084
                            predicates:
                                - Path=/v3/api-docs/matching
                            filters:
                                - SetPath=/v3/api-docs

hvostid:
    auth:
        introspect-url: http://${AUTH_SERVICE_HOST:localhost}:8081/internal/auth/introspect
        introspect-timeout: 3s
        public-paths:
            - POST /api/v1/auth/login
            - POST /api/v1/auth/register
            - POST /api/v1/auth/refresh
            - POST /api/v1/auth/password-reset/request
            - POST /api/v1/auth/password-reset/confirm
            - POST /api/v1/auth/email-verification/confirm
            - GET /api/v1/listings
            - GET /api/v1/passports/*/docs/*/content
            - GET /api/v1/passports/*/cover
            - /actuator/**
            - /swagger-ui.html
            - /swagger-ui/**
            - /v3/api-docs
            - /v3/api-docs/**
        # Soft-auth paths: filter runs but does not require a Bearer.
        # When the caller is authenticated, USER_ID/USER_ROLES are still
        # injected so the service can apply per-role logic. When the caller
        # is anonymous, the request goes through with no identity headers
        # and the service-level access check decides the response.
        optional-auth-paths:
            - GET /api/v1/listings/{id:[0-9]+}
    rate-limit:
        # Per client-IP token bucket. Sized to fit the documented k6 load
        # profile (50 VU steady-state on the public catalog, ~50 req/s from
        # one IP) with a headroom factor so a brief burst plus a logged-in
        # user on the same NAT egress still gets through.
        replenish-rate: 60
        burst-capacity: 120
        max-clients: 10000
        idle-ttl: 15m
        # Exact immediate proxy IPs, empty by default. Never trust arbitrary X-Forwarded-For.
        trusted-proxies: ${HVOSTID_RATE_LIMIT_TRUSTED_PROXIES:}
        auth-replenish-rate: 1
        auth-burst-capacity: 10

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        # Aggregated Swagger UI: lets the user pick a service from the
        # "Select a definition" dropdown. Each URL is served by a route
        # above that forwards to the corresponding service.
        urls:
            -   name: gateway
                url: /v3/api-docs
            -   name: auth-service
                url: /v3/api-docs/auth
            -   name: listing-service
                url: /v3/api-docs/listing
            -   name: passport-service
                url: /v3/api-docs/passport
            -   name: matching-service
                url: /v3/api-docs/matching

management:
    otlp:
        metrics:
            export:
                enabled: false
    opentelemetry:
        tracing:
            export:
                otlp:
                    enabled: false
    endpoints:
        web:
            exposure:
                include: health, info

logging:
    level:
        root: INFO
        ru.hvostid: DEBUG
