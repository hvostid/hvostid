server:
    port: 8082

spring:
    application:
        name: listing-service
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:hvostid_listing}
        username: ${DB_USER:hvostid}
        password: ${DB_PASSWORD:hvostid}
    flyway:
        enabled: true
        baseline-on-migrate: true
        locations: classpath:db/migration
        validate-on-migrate: true
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false

management:
    otlp:
        metrics:
            export:
                enabled: false
    opentelemetry:
        tracing:
            export:
                otlp:
                    enabled: false
    endpoints:
        web:
            exposure:
                include: health, info

logging:
    level:
        root: INFO
        ru.hvostid: DEBUG

hvostid:
    services:
        passport-url: http://${PASSPORT_SERVICE_HOST:localhost}:8083
