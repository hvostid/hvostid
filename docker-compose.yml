services:

    # --- Infrastructure ---

    postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        environment:
            POSTGRES_USER: ${DB_USER:-hvostid}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-hvostid}
            AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-hvostid_auth}
            LISTING_DB_PASSWORD: ${LISTING_DB_PASSWORD:-hvostid_listing}
            PASSPORT_DB_PASSWORD: ${PASSPORT_DB_PASSWORD:-hvostid_passport}
            MATCHING_DB_PASSWORD: ${MATCHING_DB_PASSWORD:-hvostid_matching}
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql
            - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-hvostid}" ]
            interval: 5s
            timeout: 3s
            retries: 5

    minio:
        image: hvostid/minio:2025-09-07-mc2025-08-13
        pull_policy: build
        build: ./docker/minio
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio-data:/data
        healthcheck:
            test: [ "CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/live || exit 1" ]
            interval: 5s
            timeout: 3s
            retries: 5

    minio-init:
        image: hvostid/minio:2025-09-07-mc2025-08-13
        pull_policy: build
        build: ./docker/minio
        depends_on:
            minio:
                condition: service_healthy
        environment:
            MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
            MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET:-pet-documents}
            MINIO_PHOTOS_BUCKET: ${MINIO_PHOTOS_BUCKET:-pet-photos}
        entrypoint: ["/bin/sh", "-ec"]
        command:
            - |
                mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
                mc mb --ignore-existing "local/$${MINIO_DOCUMENTS_BUCKET}"
                mc mb --ignore-existing "local/$${MINIO_PHOTOS_BUCKET}"

    redis:
        image: redis:8.2.5-alpine@sha256:82db05459fb850cc3fe2bfa510a054323247bbd0ecb8831272e41fe14b9ead82
        command: [ "redis-server", "--appendonly", "no", "--save", "" ]
        ports:
            - "6379:6379"
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 3s
            retries: 5

    sonarqube:
        image: sonarqube:community
        environment:
            SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        ports:
            - "9090:9000"
        volumes:
            - sonarqube-data:/opt/sonarqube/data
        profiles:
            - quality

    # --- Application Services ---

    api-gateway:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                SERVICE_NAME: api-gateway
                SERVICE_PORT: 8080
        ports:
            - "8080:8080"
        environment:
            MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: false
            MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENABLED: false
            AUTH_SERVICE_HOST: auth-service
            LISTING_SERVICE_HOST: listing-service
            PASSPORT_SERVICE_HOST: passport-service
            MATCHING_SERVICE_HOST: matching-service
            HVOSTID_RATE_LIMIT_TRUSTED_PROXIES: ${HVOSTID_FRONTEND_IP:-172.30.44.10}
            SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
            SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 20MB
        depends_on:
            auth-service:
                condition: service_healthy
        healthcheck:
            test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    auth-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                SERVICE_NAME: auth-service
                SERVICE_PORT: 8081
        ports:
            - "8081:8081"
        environment:
            MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: false
            MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENABLED: false
            SERVER_PORT: 8081
            AUTH_MAIL_ENCRYPTION_KEY: ${AUTH_MAIL_ENCRYPTION_KEY:-}
            AUTH_MAIL_ENABLED: ${AUTH_MAIL_ENABLED:-false}
            AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-no-reply@localhost}
            AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-http://localhost:3000}
            SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
            SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
            SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
            SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
            SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-false}
            SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-false}
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
            DB_HOST: postgres
            DB_NAME: hvostid_auth
            DB_USER: hvostid_auth
            DB_PASSWORD: ${AUTH_DB_PASSWORD:-hvostid_auth}
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    listing-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                SERVICE_NAME: listing-service
                SERVICE_PORT: 8082
        ports:
            - "8082:8082"
        environment:
            MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: false
            MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENABLED: false
            SERVER_PORT: 8082
            PASSPORT_SERVICE_HOST: passport-service
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
            DB_HOST: postgres
            DB_NAME: hvostid_listing
            DB_USER: hvostid_listing
            DB_PASSWORD: ${LISTING_DB_PASSWORD:-hvostid_listing}
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: [ "CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    passport-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                SERVICE_NAME: passport-service
                SERVICE_PORT: 8083
        ports:
            - "8083:8083"
        environment:
            MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: false
            MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENABLED: false
            SERVER_PORT: 8083
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
            DB_HOST: postgres
            DB_NAME: hvostid_passport
            DB_USER: hvostid_passport
            DB_PASSWORD: ${PASSPORT_DB_PASSWORD:-hvostid_passport}
            MINIO_HOST: minio
            MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
            MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET:-pet-documents}
            MINIO_PHOTOS_BUCKET: ${MINIO_PHOTOS_BUCKET:-pet-photos}
            LISTING_SERVICE_HOST: listing-service
            REDIS_HOST: redis
        depends_on:
            postgres:
                condition: service_healthy
            minio:
                condition: service_healthy
            minio-init:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        healthcheck:
            test: [ "CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    matching-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                SERVICE_NAME: matching-service
                SERVICE_PORT: 8084
        ports:
            - "8084:8084"
        environment:
            MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: false
            MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENABLED: false
            SERVER_PORT: 8084
            MATCHING_PARALLELISM: ${MATCHING_PARALLELISM:-16}
            MATCHING_MAX_COMPUTATIONS: ${MATCHING_MAX_COMPUTATIONS:-8}
            MATCHING_MAX_SCANNED_LISTINGS: ${MATCHING_MAX_SCANNED_LISTINGS:-10000}
            MATCHING_COMPUTATION_TIMEOUT: ${MATCHING_COMPUTATION_TIMEOUT:-30s}
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
            DB_HOST: postgres
            DB_NAME: hvostid_matching
            DB_USER: hvostid_matching
            DB_PASSWORD: ${MATCHING_DB_PASSWORD:-hvostid_matching}
            LISTING_SERVICE_HOST: listing-service
            PASSPORT_SERVICE_HOST: passport-service
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: [ "CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    # --- Frontend ---

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        networks:
            default:
                ipv4_address: ${HVOSTID_FRONTEND_IP:-172.30.44.10}
        ports:
            - "3000:80"
        depends_on:
            api-gateway:
                condition: service_healthy

volumes:
    postgres-data:
    minio-data:
    sonarqube-data:

networks:
    default:
        ipam:
            config:
                - subnet: ${HVOSTID_SUBNET:-172.30.44.0/24}
                  ip_range: ${HVOSTID_DYNAMIC_RANGE:-172.30.44.128/25}
